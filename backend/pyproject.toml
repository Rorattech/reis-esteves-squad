[project]
name = "squad-digital-backend"
version = "0.1.0"
description = "Backend FastAPI do Squad Digital — Reis Esteves Advocacia"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "langgraph>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.17",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "pypdf>=5.1",
    "pillow>=11.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app/core/db.py cria engine/async_session_factory uma única vez, no import
# do módulo — todos os testes/fixtures assíncronos precisam compartilhar o
# mesmo event loop (escopo "session"), senão o SQLAlchemy quebra com
# "Future attached to a different loop" ao reusar essa engine entre testes.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# orchestrator/ é irmão de backend/ no repo (ver backend/Dockerfile) — sem
# isso, `import orchestrator` falha ao rodar pytest de dentro de backend/.
pythonpath = [".."]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
